name: Mobile CI

on:
  pull_request:
    paths:
      - 'MobileApp (android + ios)/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: ["IC-android"]
    paths:
      - 'MobileApp (android + ios)/**'

jobs:
  mobile-health:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MobileApp (android + ios)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: MobileApp (android + ios)/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Expo doctor
        run: npm run doctor
